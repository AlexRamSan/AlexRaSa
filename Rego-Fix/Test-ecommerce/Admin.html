<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Inventario - Rego-fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <header class="bg-[#003DA5] text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <div class="font-bold text-lg"><i class="fa-solid fa-boxes-stacked mr-2"></i> Admin Inventario</div>
        <a href="index.html" class="text-sm underline hover:text-gray-200">Ir a la Tienda</a>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-6 mt-4">
        
        <!-- SECCIÓN 1: ESCÁNER -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-sm font-bold text-gray-700 mb-3 uppercase tracking-wide">1. Escanear Pieza</h2>
            
            <div class="relative bg-black rounded-lg overflow-hidden aspect-[4/3] flex items-center justify-center mb-4 shadow-inner">
                <video id="camera-feed" autoplay playsinline class="w-full h-full object-cover hidden"></video>
                <div id="camera-placeholder" class="text-gray-500 flex flex-col items-center">
                    <i class="fa-solid fa-camera text-4xl mb-2"></i>
                    <span class="text-sm">Cámara apagada</span>
                </div>
            </div>

            <div class="flex gap-2">
                <button id="btn-start-camera" onclick="startCamera()" class="flex-1 bg-gray-800 hover:bg-gray-900 text-white py-3 rounded font-semibold text-sm transition">
                    <i class="fa-solid fa-video mr-1"></i> Encender
                </button>
                <button id="btn-capture" onclick="captureAndScan()" disabled class="flex-1 bg-[#00B2E2] disabled:bg-gray-300 disabled:text-gray-500 hover:bg-blue-500 text-white py-3 rounded font-bold text-sm transition shadow">
                    <i class="fa-solid fa-expand mr-1"></i> Leer SKU
                </button>
            </div>
            
            <canvas id="canvas" class="hidden"></canvas>
        </div>

        <!-- SECCIÓN 2: GESTIÓN RÁPIDA Y MOVIMIENTOS -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <h2 class="text-sm font-bold text-gray-700 mb-3 uppercase tracking-wide">2. Gestión de Stock</h2>
            
            <div id="loading-indicator" class="hidden mb-4 p-3 bg-blue-50 text-blue-700 rounded text-sm font-semibold flex items-center justify-center">
                <i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Gemini analizando imagen...
            </div>

            <div class="mb-4">
                <label class="block text-xs font-bold text-gray-500 mb-1">Número de Parte (SKU):</label>
                <input type="text" id="sku-input" placeholder="Ej. 7610.98100" class="w-full border-2 border-gray-300 px-4 py-3 rounded-lg text-lg font-mono font-bold focus:outline-none focus:border-[#003DA5] transition">
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <button onclick="updateStock(1)" class="bg-[#D1D811] hover:bg-lime-500 text-black py-3 rounded-lg font-bold text-base shadow transition flex items-center justify-center">
                    <i class="fa-solid fa-plus mr-2"></i> + Ingreso
                </button>
                <button onclick="updateStock(-1)" class="bg-red-500 hover:bg-red-600 text-white py-3 rounded-lg font-bold text-base shadow transition flex items-center justify-center">
                    <i class="fa-solid fa-minus mr-2"></i> - Salida
                </button>
            </div>

            <button onclick="loadInventoryList()" class="w-full bg-[#003DA5] hover:bg-blue-800 text-white py-3 rounded-lg font-bold text-sm transition shadow flex items-center justify-center">
                <i class="fa-solid fa-list mr-2"></i> Ver y Administrar Catálogo Completo
            </button>
        </div>

        <!-- SECCIÓN 3: TABLA DE CONTROL MANUAL Y EDICIÓN -->
        <div id="inventory-list-container" class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 hidden">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold text-gray-700 uppercase tracking-wide">Catálogo y Edición Manual</h2>
                <button onclick="document.getElementById('inventory-list-container').classList.add('hidden')" class="text-gray-400 hover:text-gray-600 text-sm">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <p class="text-xs text-gray-500 mb-3">Aquí puedes modificar el stock o el nombre directamente, o dar de alta un producto nuevo ingresando sus datos abajo.</p>

            <!-- Formulario para agregar nuevo manual -->
            <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 mb-4 space-y-2">
                <div class="text-xs font-bold text-gray-600">Agregar nuevo SKU manualmente:</div>
                <div class="grid grid-cols-3 gap-2">
                    <input type="text" id="manual-sku" placeholder="SKU" class="border p-2 rounded text-xs font-mono">
                    <input type="text" id="manual-name" placeholder="Nombre / Descripción" class="border p-2 rounded text-xs">
                    <input type="number" id="manual-stock" placeholder="Stock" class="border p-2 rounded text-xs" value="1">
                </div>
                <button onclick="addNewItemManual()" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded text-xs font-bold transition">
                    <i class="fa-solid fa-plus-circle mr-1"></i> Guardar Nuevo Producto en BD
                </button>
            </div>

            <div id="inventory-items" class="space-y-3 max-h-96 overflow-y-auto">
                <!-- Se llena dinámicamente -->
            </div>
        </div>

    </main>

    <script>
        const video = document.getElementById('camera-feed');
        const canvas = document.getElementById('canvas');
        const btnCapture = document.getElementById('btn-capture');
        const placeholder = document.getElementById('camera-placeholder');
        const loadingIndicator = document.getElementById('loading-indicator');
        const skuInput = document.getElementById('sku-input');
        let stream = null;

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                video.classList.remove('hidden');
                placeholder.classList.add('hidden');
                btnCapture.disabled = false;
            } catch (err) {
                alert('No se pudo acceder a la cámara.');
            }
        }

        async function captureAndScan() {
            const MAX_WIDTH = 800; 
            const scale = MAX_WIDTH / video.videoWidth;
            canvas.width = MAX_WIDTH;
            canvas.height = video.videoHeight * scale;
            
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageBase64 = canvas.toDataURL('image/jpeg', 0.6);
            
            loadingIndicator.classList.remove('hidden');
            skuInput.value = '';

            try {
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imageBase64 })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error);
                
                if (data.sku && data.sku !== 'NO_DETECTADO') {
                    skuInput.value = data.sku;
                    // Auto-registrar en Supabase si no existe al escanear
                    await registerOrTouchSku(data.sku);
                } else {
                    alert('Gemini no logró identificar un SKU claro.');
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        async function registerOrTouchSku(sku) {
            try {
                await fetch('/api/inventory', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sku: sku, quantityChange: 0 })
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function updateStock(change) {
            const sku = skuInput.value.trim();
            if (!sku) {
                alert('Escribe o escanea un SKU primero.');
                return;
            }

            try {
                const response = await fetch('/api/inventory', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sku: sku, quantityChange: change })
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    alert(`¡Actualizado! Stock actual de ${sku}: ${data.newStock}`);
                } else {
                    alert(`Error: ${data.error}`);
                }
            } catch (error) {
                alert('Error de conexión.');
            }
        }

        async function loadInventoryList() {
            const container = document.getElementById('inventory-list-container');
            const listDiv = document.getElementById('inventory-items');
            
            listDiv.innerHTML = '<div class="text-center text-gray-500 py-4"><i class="fa-solid fa-circle-notch fa-spin"></i> Cargando base de datos...</div>';
            container.classList.remove('hidden');

            try {
                const response = await fetch('/api/inventory');
                const items = await response.json();

                if (!response.ok) throw new Error(items.error);

                if (items.length === 0) {
                    listDiv.innerHTML = '<div class="text-gray-500 text-center py-2">No hay registros.</div>';
                    return;
                }

                listDiv.innerHTML = items.map(item => `
                    <div class="bg-gray-50 p-3 rounded-lg border border-space flex flex-col gap-2">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-[#003DA5] font-mono text-sm">${item.sku}</span>
                            <span class="text-xs text-gray-400">Act: ${new Date(item.last_updated || Date.now()).toLocaleDateString()}</span>
                        </div>
                        <input type="text" id="name-${item.sku}" value="${item.name || ''}" placeholder="Descripción de la pieza" class="border p-1.5 rounded text-xs bg-white">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-1">
                                <span class="text-xs font-semibold text-gray-600">Stock:</span>
                                <input type="number" id="stock-${item.sku}" value="${item.stock}" class="border p-1.5 rounded w-20 text-center font-mono font-bold text-sm bg-white">
                            </div>
                            <button onclick="saveManualEdit('${item.sku}')" class="bg-[#003DA5] hover:bg-blue-800 text-white px-3 py-1.5 rounded text-xs font-bold transition">
                                <i class="fa-solid fa-floppy-disk mr-1"></i> Guardar Cambios
                            </button>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                listDiv.innerHTML = `<div class="text-red-500 text-center py-2">Error: ${error.message}</div>`;
            }
        }

        async function saveManualEdit(sku) {
            const newStock = document.getElementById(`stock-${sku}`).value;
            const newName = document.getElementById(`name-${sku}`).value;

            try {
                const response = await fetch('/api/inventory', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sku: sku, stock: newStock, name: newName })
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    alert(`¡Cambios guardados para ${sku}!`);
                    loadInventoryList();
                } else {
                    alert(`Error: ${data.error}`);
                }
            } catch (e) {
                alert('Error al guardar cambios.');
            }
        }

        async function addNewItemManual() {
            const sku = document.getElementById('manual-sku').value.trim();
            const name = document.getElementById('manual-name').value.trim();
            const stock = document.getElementById('manual-stock').value;

            if (!sku || !name) {
                alert('Debes ingresar al menos el SKU y el nombre del producto.');
                return;
            }

            try {
                const response = await fetch('/api/inventory', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sku: sku, name: name, initialStock: parseInt(stock) || 0 })
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    alert('¡Producto agregado con éxito!');
                    document.getElementById('manual-sku').value = '';
                    document.getElementById('manual-name').value = '';
                    document.getElementById('manual-stock').value = '1';
                    loadInventoryList();
                } else {
                    alert(`Error: ${data.error}`);
                }
            } catch (e) {
                alert('Error al registrar el producto.');
            }
        }
    </script>
</body>
</html>
