<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFMX - Dashboard de Presentación Semanal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; color: #333; margin: 0; padding: 30px; }
        .control-panel { max-width: 1120px; margin: 0 auto 30px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 22px; color: #111; }
        .btn { background-color: #0076d3; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; transition: background 0.2s; }
        .btn:hover { background-color: #005cb3; }
        .btn-secondary { background-color: #28a745; margin-left: 10px; }
        .btn-secondary:hover { background-color: #218838; }
        
        .slides-wrapper { max-width: 1120px; margin: 0 auto; }
        
        /* Formato estándar de Diapositiva Ejecutiva de 16:9 (Proporción exacta) */
        .slide { 
            width: 1120px; height: 630px; background: white; margin-bottom: 40px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); border-radius: 6px; overflow: hidden;
            position: relative; padding: 50px 60px; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: flex-start;
        }
        .slide-header { border-bottom: 3px solid #0076d3; padding-bottom: 12px; margin-bottom: 30px; }
        .slide-header h2 { margin: 0; color: #0076d3; font-size: 32px; text-transform: uppercase; font-weight: 700; }
        .slide-content { font-size: 20px; line-height: 1.6; flex-grow: 1; color: #444; }
        
        /* Clases de Maquetación */
        .grid-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 10px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .kpi-card { background: #f8f9fa; border-left: 6px solid #0076d3; padding: 20px; border-radius: 4px; }
        .kpi-label { font-size: 16px; text-transform: uppercase; color: #666; font-weight: 600; margin-bottom: 5px; }
        .kpi-value { font-size: 28px; font-weight: bold; color: #111; }
        
        ul.list-bullets { padding-left: 20px; margin: 0; }
        ul.list-bullets li { margin-bottom: 15px; }
        
        .footer-slide { position: absolute; bottom: 25px; left: 60px; right: 60px; display: flex; justify-content: space-between; font-size: 13px; color: #999; border-top: 1px solid #eee; padding-top: 10px; }
        
        /* Portada especial */
        .slide-cover { background: linear-gradient(135deg, #004b87 0%, #0076d3 100%); color: white; justify-content: center; align-items: center; text-align: center; }
        .slide-cover h2 { font-size: 46px; margin-bottom: 10px; text-transform: uppercase; font-weight: 800; color: white; }
        .slide-cover h3 { font-size: 24px; font-weight: 400; opacity: 0.9; margin-top: 0; }
        .slide-cover .meta-info { margin-top: 50px; font-size: 18px; opacity: 0.8; line-height: 1.8; }
    </style>
</head>
<body>

<div class="control-panel">
    <h1>REGO-FIX México — Generador de Reporte Semanal</h1>
    <div>
        <button class="btn" onclick="fetchAndGenerate()">⚡ Sincronizar Salesforce y IA</button>
        <button class="btn btn-secondary" onclick="exportarImagenes()">📸 Descargar Diapositivas (PNG)</button>
    </div>
</div>

<div class="slides-wrapper" id="slides-container">
    <p style="text-align: center; color: #777; font-size: 18px; margin-top: 50px;">Presiona "Sincronizar" para estructurar los datos comerciales de la semana.</p>
</div>

<script>
    async function fetchAndGenerate() {
        document.getElementById('slides-container').innerHTML = '<p style="text-align:center; font-size:18px;">Consultando Salesforce y procesando con GPT-4o...</p>';
        
        // Aquí conectas tu data real extraída de Salesforce
        const salesforcePayload = { data: "Data cruda recolectada de la cuenta de ventas..." };

        try {
            const response = await fetch('/api/generate-report.js', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ salesforceRawData: salesforcePayload })
            });
            
            const data = await response.json();
            renderAllSlides(data);
        } catch (error) {
            document.getElementById('slides-container').innerHTML = '<p style="text-align:center; color:red; font-size:18px;">Error al conectar con la API o procesar la información.</p>';
        }
    }

    function renderAllSlides(data) {
        const container = document.getElementById('slides-container');
        container.innerHTML = `
            <div class="slide slide-cover" id="slide-1">
                <h2>Revisión Semanal de Ventas</h2>
                <h3>REGO-FIX México</h3>
                <div class="meta-info">
                    <strong>Región:</strong> ${data.slide1_portada.region}<br>
                    <strong>Fecha:</strong> ${data.slide1_portada.fecha}
                </div>
            </div>

            <div class="slide" id="slide-2">
                <div class="slide-header"><h2>01. Resultados del Mes</h2></div>
                <div class="slide-content grid-kpis">
                    <div class="kpi-card"><div class="kpi-label">Budget Mensual</div><div class="kpi-value">${data.slide2_resultados.budget}</div></div>
                    <div class="kpi-card"><div class="kpi-label">Venta Facturada</div><div class="kpi-value">${data.slide2_resultados.facturado}</div></div>
                    <div class="kpi-card"><div class="kpi-label">% Cumplimiento</div><div class="kpi-value">${data.slide2_resultados.cumplimiento}</div></div>
                    <div class="kpi-card"><div class="kpi-label">Back Order</div><div class="kpi-value">${data.slide2_resultados.backorder}</div></div>
                    <div class="kpi-card"><div class="kpi-label">Forecast de Cierre</div><div class="kpi-value">${data.slide2_resultados.forecast}</div></div>
                </div>
                <div class="footer-slide"><span>RFMX Interno</span><span>Pág. 2</span></div>
            </div>

            <div class="slide" id="slide-3">
                <div class="slide-header"><h2>02. Profit y Rentabilidad</h2></div>
                <div class="slide-content grid-kpis">
                    <div class="kpi-card"><div class="kpi-label">Margen de Proyectos</div><div class="kpi-value">${data.slide3_profit.margen_proyectos}</div></div>
                    <div class="kpi-card"><div class="kpi-label">Descuentos Activos</div><div class="kpi-value">${data.slide3_profit.descuentos_activos}</div></div>
                    <div class="kpi-card"><div class="kpi-label">Venta Directa vs Distribución</div><div class="kpi-value">${data.slide3_profit.directo_vs_distribucion}</div></div>
                </div>
                <div class="footer-slide"><span>RFMX Interno</span><span>Pág. 3</span></div>
            </div>

            <div class="slide" id="slide-4">
                <div class="slide-header"><h2>03. Actividad Comercial</h2></div>
                <div class="slide-content grid-2">
                    <div class="kpi-card"><div class="kpi-label">Visitas Realizadas</div><div class="kpi-value">${data.slide4_actividad.visitas}</div></div>
                    <div class="kpi-card"><div class="kpi-label">Nuevas Oportunidades</div><div class="kpi-value">${data.slide4_actividad.nuevas_oportunidades}</div></div>
                    <div>
                        <ul class="list-bullets">
                            <li><strong>Proyectos Activos:</strong> ${data.slide4_actividad.proyectos_activos}</li>
                            <li><strong>Actividades en Salesforce:</strong> ${data.slide4_actividad.actividades_salesforce}</li>
                            <li><strong>Demos / Pruebas Activas:</strong> ${data.slide4_actividad.demos_activas}</li>
                        </ul>
                    </div>
                </div>
                <div class="footer-slide"><span>RFMX Interno</span><span>Pág. 4</span></div>
            </div>

            <div class="slide" id="slide-5">
                <div class="slide-header"><h2>04. Recuperación y Demos</h2></div>
                <div class="slide-content">
                    <ul class="list-bullets">
                        <li><strong>Material en Campo:</strong> ${data.slide5_recuperacion.material_campo}</li>
                        <li><strong>Recuperación Pendiente:</strong> ${data.slide5_recuperacion.recuperacion_pendiente}</li>
                        <li><strong>Estatus de Demos:</strong> ${data.slide5_recuperacion.estatus_demos}</li>
                    </ul>
                </div>
                <div class="footer-slide"><span>RFMX Interno</span><span>Pág. 5</span></div>
            </div>

            <div class="slide" id="slide-6">
                <div class="slide-header"><h2>05. Cobranza</h2></div>
                <div class="slide-content grid-2">
                    <div class="kpi-card" style="border-left-color: #dc3545;"><div class="kpi-label">Cartera Vencida</div><div class="kpi-value">${data.slide6_cobranza.cartera_vencida}</div></div>
                    <div>
                        <ul class="list-bullets">
                            <li><strong>Compromisos de Pago:</strong> ${data.slide6_cobranza.compromisos_pago}</li>
                            <li><strong>Clientes Críticos:</strong> ${data.slide6_cobranza.clientes_criticos}</li>
                        </ul>
                    </div>
                </div>
                <div class="footer-slide"><span>RFMX Interno</span><span>Pág. 6</span></div>
            </div>

            <div class="slide" id="slide-7">
                <div class="slide-header"><h2>06. Plan de Acción</h2></div>
                <div class="slide-content">
                    <p><strong>Estrategia para Cumplir Meta:</strong> ${data.slide7_plan_accion.estrategia}</p>
                    <p><strong>Cuentas Prioritarias:</strong> ${data.slide7_plan_accion.cuentas_prioritarias}</p>
                    <p><strong>Acciones de la Siguiente Semana:</strong> ${data.slide7_plan_accion.acciones_proxima_semana}</p>
                    <p style="background: #e6f2ff; padding: 15px; border-radius: 4px; border-left: 4px solid #0076d3;">
                        <strong>Apoyo Requerido de Gerencia:</strong> ${data.slide7_plan_accion.apoyo_gerencia}
                    </p>
                </div>
                <div class="footer-slide"><span>RFMX Interno</span><span>Pág. 7</span></div>
            </div>
        `;
    }

    function exportarImagenes() {
        const slides = ['slide-1', 'slide-2', 'slide-3', 'slide-4', 'slide-5', 'slide-6', 'slide-7'];
        slides.forEach((id, index) => {
            const element = document.getElementById(id);
            if(element) {
                html2canvas(element, { scale: 2 }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `RFMX_Diapositiva_${index + 1}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
            }
        });
    }
</script>
</body>
</html>
