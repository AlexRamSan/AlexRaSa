<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REGO-FIX Asistente AI</title>
    <style>
        :root { --primary: #0070d2; --bg: #f4f6f9; --text: #16325c; --card: #ffffff; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 600px; }
        .header { text-align: center; margin-bottom: 20px; }
        .mic-btn { width: 80px; height: 80px; border-radius: 50%; background-color: var(--primary); color: white; border: none; font-size: 30px; box-shadow: 0 4px 10px rgba(0,112,210,0.3); cursor: pointer; transition: transform 0.2s; display: flex; justify-content: center; align-items: center; margin: 0 auto 30px auto; }
        .mic-btn:active { transform: scale(0.95); }
        .mic-btn.recording { background-color: #e53935; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(229, 57, 53, 0); } 100% { box-shadow: 0 0 0 0 rgba(229, 57, 53, 0); } }
        .log-area { background: var(--card); border-radius: 12px; padding: 20px; min-height: 200px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card { background: #fdfdfd; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-bottom: 10px; }
        .btn-action { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-action:disabled { background: #ccc; }
        .file-input-wrapper { margin-top: 10px; padding: 10px; background: #eef4fb; border-radius: 6px; font-size: 14px; }
        input[type="file"] { width: 100%; }
        .spinner { display: none; margin: 20px auto; width: 40px; height: 40px; border: 4px solid rgba(0,0,0,0.1); border-left-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Asistente REGO-FIX</h2>
        <p>Toca para dictar comandos o registrar minutas</p>
    </div>

    <button id="micBtn" class="mic-btn">🎙️</button>
    <div id="loading" class="spinner"></div>

    <div class="log-area" id="logArea">
        <i>Esperando instrucciones...</i>
    </div>
</div>

<script>
    const micBtn = document.getElementById('micBtn');
    const logArea = document.getElementById('logArea');
    const loading = document.getElementById('loading');
    
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let globalPlan = null; // Guarda el plan de la IA para confirmaciones

    // RUTA A TU VERCEL
    const API_URL = 'https://www.alexrasa.store/api/asistente'; 

    micBtn.addEventListener('click', async () => {
        if (!isRecording) {
            startRecording();
        } else {
            stopRecording();
        }
    });

    async function startRecording() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
            
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                await sendToBackend(audioBlob);
            };

            mediaRecorder.start();
            isRecording = true;
            micBtn.classList.add('recording');
        } catch (err) {
            alert('Error al acceder al micrófono: ' + err);
        }
    }

    function stopRecording() {
        mediaRecorder.stop();
        isRecording = false;
        micBtn.classList.remove('recording');
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
    }

    async function sendToBackend(audioBlob) {
        setLoading(true);
        const formData = new FormData();
        formData.append('audio', audioBlob, 'grabacion.webm');

        try {
            const response = await fetch(API_URL, { method: 'POST', body: formData });
            const data = await response.json();
            handleBackendResponse(data);
        } catch (error) {
            logArea.innerHTML = `<span style="color:red">Error: ${error.message}</span>`;
        } finally {
            setLoading(false);
        }
    }

    function handleBackendResponse(data) {
        if (!data.success) {
            logArea.innerHTML = `<b>Error:</b> ${data.error}`;
            return;
        }

        let html = `<h3>✅ Acción procesada</h3>`;
        if (data.message) html += `<p>${data.message}</p>`;

        // LISTADO DE CONSULTAS (Oportunidades, Pendientes)
        if (['CONSULTAR_OPORTUNIDADES', 'CONSULTAR_PENDIENTES', 'CONSULTAR_TAREAS_JEFE'].includes(data.intent)) {
            if (data.data.length === 0) {
                html += `<p>No hay registros que mostrar.</p>`;
            } else {
                data.data.forEach(item => {
                    html += `<div class="card">
                                <strong>${item.name || item.Name || item.Subject}</strong><br>
                                <small>${item.info || item.ActivityDate || ''}</small>
                             </div>`;
                });
            }
            logArea.innerHTML = html;
            return;
        }

        // FLUJO: CERRAR COTIZACIÓN
        if (data.intent === 'CERRAR_COTIZACION' && data.needConfirmation) {
            globalPlan = data.plan;
            html += `<p>Selecciona la oportunidad para cerrarla y subir la Orden de Compra:</p>`;
            data.records.forEach(opp => {
                html += `<div class="card">
                            <strong>${opp.Name}</strong> ($${opp.Amount || 0})
                            <div class="file-input-wrapper">
                                <label>Adjuntar Orden de Compra (PDF/Img):</label>
                                <input type="file" id="file_${opp.Id}" accept=".pdf,image/*">
                            </div>
                            <button class="btn-action" onclick="confirmarCierre('${opp.Id}')">Cerrar Ganada y Subir</button>
                         </div>`;
            });
            logArea.innerHTML = html;
            return;
        }

        // FLUJO: REGISTRAR ACTIVIDAD O AGENDAR
        if (['REGISTRAR_ACTIVIDAD', 'AGENDAR_VISITA'].includes(data.intent) && data.needConfirmation) {
            globalPlan = data.plan;
            html += `<p>Selecciona la cuenta para guardar: <b>${globalPlan.asunto}</b></p>`;
            data.records.forEach(acc => {
                html += `<div class="card">
                            <strong>${acc.Name}</strong> (${acc.BillingCity || 'Sin ciudad'})
                            <button class="btn-action" onclick="confirmarAccion('${acc.Id}')">Vincular y Guardar</button>
                         </div>`;
            });
            logArea.innerHTML = html;
            return;
        }

        logArea.innerHTML = html + `<p>Procesado, pero no se encontraron registros coincidentes.</p>`;
    }

    // ENVIAR CONFIRMACIÓN A SALESFORCE (Minutas y Eventos)
    async function confirmarAccion(accountId) {
        setLoading(true);
        const payload = {
            taskType: globalPlan.intent === 'AGENDAR_VISITA' ? 'EVENTO' : 'TAREA',
            accountId: accountId,
            subject: globalPlan.asunto,
            description: globalPlan.detalles,
            fecha: globalPlan.fecha,
            hora: globalPlan.hora
        };

        const formData = new FormData();
        formData.append('action', 'confirmar');
        formData.append('payload', JSON.stringify(payload));

        await ejecutarConfirmacion(formData);
    }

    // ENVIAR CIERRE CON ARCHIVO (Orden de Compra)
    async function confirmarCierre(opportunityId) {
        setLoading(true);
        const fileInput = document.getElementById(`file_${opportunityId}`);
        
        const payload = {
            taskType: 'CERRAR_COTIZACION',
            opportunityId: opportunityId
        };

        const formData = new FormData();
        formData.append('action', 'confirmar');
        formData.append('payload', JSON.stringify(payload));
        
        if (fileInput.files.length > 0) {
            formData.append('documento', fileInput.files[0]);
        }

        await ejecutarConfirmacion(formData);
    }

    async function ejecutarConfirmacion(formData) {
        try {
            const response = await fetch(API_URL, { method: 'POST', body: formData });
            const result = await response.json();
            logArea.innerHTML = `<h3 style="color:green">${result.message || 'Operación exitosa'}</h3>`;
        } catch (error) {
            logArea.innerHTML = `<span style="color:red">Error: ${error.message}</span>`;
        } finally {
            setLoading(false);
        }
    }

    function setLoading(isLoading) {
        loading.style.display = isLoading ? 'block' : 'none';
        logArea.style.opacity = isLoading ? '0.5' : '1';
        micBtn.disabled = isLoading;
    }
</script>

</body>
</html>
