<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REGO-FIX | Full Assistant</title>
    
    <link rel="manifest" href="/manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RFMX Assist">
    <link rel="apple-touch-icon" href="/assets/regofixlogo.png">

    <style>
        :root { --rf-blue: #0044BB; --rf-lime: #76FF03; --rf-bg: #F4F7F6; --rf-white: #FFFFFF; --rf-gray: #e0e6ed; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--rf-bg); padding: 20px; display: flex; justify-content: center; margin: 0; }
        .card { background: var(--rf-white); padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); width: 100%; max-width: 480px; text-align: center; border-top: 6px solid var(--rf-blue); margin-top: 20px; box-sizing: border-box; }
        .logo { max-width: 140px; margin-bottom: 20px; }
        
        /* Controles de Voz */
        .mic-btn { width: 80px; height: 80px; border-radius: 50%; border: none; background: var(--rf-blue); color: white; font-size: 30px; cursor: pointer; transition: 0.3s; margin: 15px 0; outline: none; }
        .mic-btn.recording { background: var(--rf-lime); color: #000; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .status { font-weight: bold; font-size: 13px; color: var(--rf-blue); text-transform: uppercase; margin-bottom: 10px; }
        
        /* Bloque de Accesos Rápidos */
        .quick-actions-title { font-size: 14px; font-weight: bold; text-transform: uppercase; color: #555; margin: 25px 0 10px 0; border-top: 1px dashed var(--rf-gray); padding-top: 15px; text-align: left; }
        .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-quick { background: #f8f9fa; border: 1px solid var(--rf-gray); padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; color: #333; cursor: pointer; text-align: left; display: flex; align-items: center; transition: all 0.2s; }
        .btn-quick:hover { border-color: var(--rf-blue); background: #f0f4ff; color: var(--rf-blue); }
        .btn-quick span { margin-right: 8px; font-size: 16px; }

        /* Formulario dinámico */
        .form-popup { background: #f8fafe; border: 1px solid #d0daf0; padding: 15px; border-radius: 8px; margin-top: 15px; text-align: left; display: none; }
        .form-popup h4 { margin: 0 0 10px 0; color: var(--rf-blue); font-size: 15px; }
        .form-popup label { font-size: 12px; font-weight: bold; color: #555; display: block; margin-bottom: 4px; }
        .form-popup input, .form-popup textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 10px; font-family: inherit; font-size: 14px; }
        
        /* Caja de Resultados y Listas */
        .result-box { background: #f0f4f8; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: left; display: none; border-left: 5px solid var(--rf-blue); }
        .transcript { font-style: italic; color: #7f8c8d; font-size: 12px; margin-bottom: 10px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .account-list { text-align: left; max-height: 200px; overflow-y: auto; margin-top: 15px; }
        .account-item { background: #fff; padding: 12px; border: 1px solid #d1d8e0; border-radius: 8px; margin-bottom: 8px; cursor: pointer; font-size: 14px; }
        .account-item:hover { border-color: var(--rf-blue); background: #f4f8ff; color: var(--rf-blue); }
        .search-input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ddd; margin-bottom: 10px; box-sizing: border-box; }
        .btn-submit { background: var(--rf-blue); color: white; padding: 8px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>

    <script>
        // Registrar el Service Worker automáticamente al abrir la página
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker de Asistente registrado'))
                    .catch(err => console.log('Error al registrar SW', err));
            });
        }
    </script>
</head>
<body>

<div class="card">
    <img src="/assets/regofixlogo.png" class="logo" alt="REGO-FIX">
    <h2>Asistente de Campo</h2>
    <div id="status" class="status">Pulsa para hablar o selecciona una categoría</div>
    
    <button class="mic-btn" id="micBtn">🎤</button>

    <div class="quick-actions-title">📝 Reportar Directo a Salesforce</div>
    <div class="quick-grid">
        <button class="btn-quick" onclick="openQuickForm('visita', '📊 Reportar Visita / Minuta', 'Describre brevemente los acuerdos de la visita técnica...')"><span>🏢</span>Minuta Visita</button>
        <button class="btn-quick" onclick="openQuickForm('demo', '🔧 Estatus de Demo / Pruebas', 'Detalla la herramienta en prueba y parámetros de rendimiento...')"><span>⚙️</span>Prueba / Demo</button>
        <button class="btn-quick" onclick="openQuickForm('oportunidad', '💡 Nueva Oportunidad', '¿Qué requerimiento o cotización de herramental se detectó?')"><span>💰</span>Oportunidad</button>
        <button class="btn-quick" onclick="openQuickForm('cobranza', '💵 Compromiso de Pago', 'Saldos pendientes o acuerdos de fecha de cobro...')"><span>💳</span>Cobranza</button>
    </div>

    <div id="quickForm" class="form-popup">
        <h4 id="formTitle">Reporte Comercial</h4>
        <label for="formContent">Información para el Reporte Semanal:</label>
        <textarea id="formContent" rows="3" placeholder="Escribe aquí los detalles..."></textarea>
        <button class="btn-submit" onclick="submitQuickForm()">🚀 Enviar y Buscar Cuenta</button>
    </div>

    <div id="resultBox" class="result-box">
        <div class="transcript" id="transcript"></div>
        <div id="aiMessage"></div>
        
        <div id="accountSection" style="display:none; margin-top: 15px;">
            <input type="text" id="manualSearch" class="search-input" placeholder="Filtrar cuentas manualmente...">
            <div id="listContainer" class="account-list"></div>
        </div>
    </div>
</div>

<script>
    const micBtn = document.getElementById('micBtn');
    const statusText = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const aiMessage = document.getElementById('aiMessage');
    const accountSection = document.getElementById('accountSection');
    const listContainer = document.getElementById('listContainer');
    const manualSearch = document.getElementById('manualSearch');
    
    const quickForm = document.getElementById('quickForm');
    const formTitle = document.getElementById('formTitle');
    const formContent = document.getElementById('formContent');

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let lastPlan = null;
    let allAccounts = [];
    let currentCategory = '';

    micBtn.onclick = async () => {
        quickForm.style.display = 'none';
        if (!isRecording) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            mediaRecorder.onstop = () => processAudio(new Blob(audioChunks, { type: 'audio/webm' }));
            mediaRecorder.start();
            isRecording = true;
            micBtn.classList.add('recording');
            statusText.innerText = "Escuchando...";
            resultBox.style.display = 'none';
        } else {
            mediaRecorder.stop();
            isRecording = false;
            micBtn.classList.remove('recording');
            statusText.innerText = "Analizando...";
        }
    };

    async function processAudio(blob) {
        const formData = new FormData();
        formData.append('audio', blob, 'registro.webm'); 
        sendToBackend(formData);
    }

    function openQuickForm(category, title, placeholder) {
        resultBox.style.display = 'none';
        currentCategory = category;
        formTitle.innerText = title;
        formContent.value = '';
        formContent.placeholder = placeholder;
        quickForm.style.display = 'block';
        statusText.innerText = "Llenando " + category;
    }

    async function submitQuickForm() {
        const textValue = formContent.value.trim();
        if(!textValue) { alert("Por favor escribe los detalles del reporte."); return; }

        statusText.innerText = "Procesando...";
        quickForm.style.display = 'none';

        const formData = new FormData();
        formData.append('texto', `[Categoría: ${currentCategory.toUpperCase()}] ` + textValue);

        sendToBackend(formData);
    }

    async function sendToBackend(formData) {
        try {
            const res = await fetch('/api/asistente', { method: 'POST', body: formData });
            const data = await res.json();

            if (data.success) {
                lastPlan = data.plan;
                resultBox.style.display = 'block';
                document.getElementById('transcript').innerText = data.transcript ? `"${data.transcript}"` : "Registro Manual Estructurado";
                
                if (data.accounts && data.accounts.length > 0) {
                    aiMessage.innerText = "Selecciona la planta o cliente de Salesforce:";
                    renderList(data.accounts);
                } else {
                    aiMessage.innerText = "⚠️ No asocié una cuenta automáticamente. Elige la cuenta destino:";
                    loadAllAccounts();
                }
                statusText.innerText = "Listo";
            } else {
                alert("Error: " + data.error);
                statusText.innerText = "Reintentar";
            }
        } catch (e) { statusText.innerText = "Error de Red"; }
    }

    async function loadAllAccounts() {
        accountSection.style.display = 'block';
        listContainer.innerHTML = 'Cargando cuentas de Salesforce...';
        
        const formData = new FormData();
        formData.append('action', 'getAllAccounts');
        
        const res = await fetch('/api/asistente', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
            allAccounts = data.accounts;
            renderList(allAccounts);
        }
    }

    function renderList(accounts) {
        accountSection.style.display = 'block';
        listContainer.innerHTML = '';
        accounts.forEach(acc => {
            const div = document.createElement('div');
            div.className = 'account-item';
            div.innerHTML = `<strong>${acc.Name}</strong><br><small>${acc.BillingCity || ''}</small>`;
            div.onclick = () => confirmar(acc.Id, acc.Name);
            listContainer.appendChild(div);
        });
    }

    manualSearch.oninput = (e) => {
        const val = e.target.value.toLowerCase();
        const filtered = allAccounts.filter(a => a.Name.toLowerCase().includes(val));
        renderList(filtered);
    };

    async function confirmar(id, name) {
        statusText.innerText = "Sincronizando...";
        const formData = new FormData();
        formData.append('action', 'confirmar');
        formData.append('payload', JSON.stringify({
            accountId: id,
            subject: lastPlan.asunto,
            description: lastPlan.detalles,
            taskType: lastPlan.intent === 'AGENDAR_CITA' ? 'EVENTO' : 'TAREA',
            fecha: lastPlan.fecha,
            hora: lastPlan.hora
        }));

        const res = await fetch('/api/asistente', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
            aiMessage.innerHTML = `<b style="color:green">✅ Sincronizado e inyectado en: ${name}</b>`;
            accountSection.style.display = 'none';
            statusText.innerText = "Completado";
        }
    }
</script>
</body>
</html>
